name: Build launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore .\VolicraftLauncher.csproj

      - name: Build
        run: dotnet build .\VolicraftLauncher.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish .\VolicraftLauncher.csproj --configuration Release --self-contained true --runtime win-x64 --output .\publish

      - name: Package launcher
        shell: pwsh
        run: Compress-Archive -Path .\publish\* -DestinationPath .\VolicraftLauncher-win-x64.zip

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolicraftLauncher-win-x64
          path: VolicraftLauncher-win-x64.zip
