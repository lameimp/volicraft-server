name: Build launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Build
        run: dotnet build .\VolicraftLauncher.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish .\VolicraftLauncher.csproj --configuration Release --self-contained false --output .\publish

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolicraftLauncher
          path: publish/
